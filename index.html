<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Financial Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            playfair: ["Playfair Display", "serif"],
                            poppins: ["Poppins", "sans-serif"],
                        },
                    },
                },
            };
        </script>
    </head>

    <body
        class="font-poppins bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen p-4 sm:p-6 lg:p-8 transition-colors duration-200"
    >
        <div class="container mx-auto max-w-7xl">
            <div
                class="flex justify-between items-center mb-8 bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 border border-gray-200 dark:border-gray-700"
            >
                <h1
                    class="font-playfair text-4xl sm:text-5xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 bg-clip-text text-transparent tracking-tight"
                >
                    Financial Dashboard
                </h1>
                <button
                    id="darkModeToggle"
                    class="p-3 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg group"
                >
                    <svg
                        class="w-6 h-6 text-yellow-500 hidden dark:block group-hover:rotate-45 transition-transform duration-300"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                        ></path>
                    </svg>
                    <svg
                        class="w-6 h-6 text-indigo-600 dark:hidden group-hover:scale-110 transition-transform duration-300"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                        ></path>
                    </svg>
                </button>
            </div>

            <div id="financialSections" class="space-y-6"></div>
        </div>

        <script src="./forex.js"></script>
        <script src="./financials.js"></script>
        <script>
            const sliderValues = {};

            const customFunctions = {
                slider: (sliderKey, min, max, defaultValue, step = 1) => {
                    return sliderValues[sliderKey] !== undefined
                        ? sliderValues[sliderKey]
                        : defaultValue;
                },
                compoundrate: (rate, years) => Math.pow(1 + rate, years),
                min: Math.min,
                max: Math.max,
            };

            function evaluateFormula(formula, variables, allData) {
                const expandedVars = new Set();

                const expansionStack = [];

                let currentFormula = formula;
                let madeSubstitution = true;

                while (madeSubstitution) {
                    madeSubstitution = false;

                    const varRegex =
                        /\b([A-Za-z][A-Za-z0-9]*(?:\.[A-Za-z][A-Za-z0-9]*)?)\b/g;
                    let match;
                    let newFormula = currentFormula;

                    while ((match = varRegex.exec(currentFormula)) !== null) {
                        const varName = match[1];

                        let value;
                        if (varName.includes(".")) {
                            const [section, name] = varName.split(".");
                            if (
                                allData[section] &&
                                allData[section].find(
                                    (item) => Object.keys(item)[0] === name,
                                )
                            ) {
                                const item = allData[section].find(
                                    (item) => Object.keys(item)[0] === name,
                                );
                                value = item[name];

                                const sectionVars = extractVariables(
                                    allData[section],
                                );
                                const sectionVarRegex =
                                    /\b([A-Za-z][A-Za-z0-9\.]*)\b/g;
                                let sectionVarMatch;
                                let processedValue = value;

                                while (
                                    (sectionVarMatch =
                                        sectionVarRegex.exec(value)) !== null
                                ) {
                                    const sectionVarName = sectionVarMatch[1];

                                    if (
                                        sectionVars[sectionVarName] &&
                                        !sectionVarName.includes(".")
                                    ) {
                                        processedValue = processedValue.replace(
                                            new RegExp(
                                                `\\b${sectionVarName}\\b`,
                                                "g",
                                            ),
                                            `${section}.${sectionVarName}`,
                                        );
                                    }
                                }
                                value = processedValue;
                            }
                        } else if (variables[varName]) {
                            value = variables[varName].formula;
                        }

                        if (value !== undefined) {
                            expansionStack.push({ varName, value });

                            newFormula = newFormula.replace(
                                new RegExp(`\\b${varName}\\b`, "g"),
                                `(${value})`,
                            );
                            expandedVars.add(varName);
                            madeSubstitution = true;
                        }
                    }

                    currentFormula = newFormula;

                    if (!madeSubstitution) {
                        break;
                    }
                }

                try {
                    return parseAndEvaluate(currentFormula, forex);
                } catch (error) {
                    let errorMessage = `Error: ${error.message}\n\nExpansion Stack:\n`;
                    errorMessage += `Original formula: ${formula}\n`;
                    expansionStack.forEach((expansion, index) => {
                        errorMessage += `${index + 1}. ${expansion.varName} → ${expansion.value}\n`;
                    });
                    errorMessage += `Final formula: ${currentFormula}`;
                    console.error(
                        "Error evaluating formula:",
                        error,
                        currentFormula,
                        errorMessage,
                    );
                    return error.message;
                }
            }

            function parseAndEvaluate(expression, forexData) {
                const tokens = tokenize(expression);

                const ast = parse(tokens);

                return evaluate(ast, forexData);
            }

            function tokenize(expression) {
                const tokenRegex =
                    /\s*([0-9]+(?:\.[0-9]+)?|\+|\-|\*|\/|\%|\(|\)|\,|[A-Za-z][A-Za-z0-9]*(?:\.[A-Za-z][A-Za-z0-9]*)?)\s*/g;
                const tokens = [];
                let match;

                while ((match = tokenRegex.exec(expression)) !== null) {
                    const token = match[1];
                    if (token.match(/^[0-9]+(?:\.[0-9]+)?$/)) {
                        tokens.push({
                            type: "number",
                            value: parseFloat(token),
                        });
                    } else if (
                        token.match(
                            /^[A-Za-z][A-Za-z0-9]*(?:\.[A-Za-z][A-Za-z0-9]*)?$/,
                        )
                    ) {
                        tokens.push({ type: "identifier", value: token });
                    } else {
                        tokens.push({ type: "operator", value: token });
                    }
                }

                return tokens;
            }

            function parse(tokens) {
                let position = 0;

                function parseExpression() {
                    return parseAdditive();
                }

                function parseAdditive() {
                    let left = parseMultiplicative();

                    while (
                        position < tokens.length &&
                        tokens[position].type === "operator" &&
                        (tokens[position].value === "+" ||
                            tokens[position].value === "-")
                    ) {
                        const operator = tokens[position].value;
                        position++;
                        const right = parseMultiplicative();
                        left = { type: "binary", operator, left, right };
                    }

                    return left;
                }

                function parseMultiplicative() {
                    let left = parsePrimary();

                    while (
                        position < tokens.length &&
                        tokens[position].type === "operator" &&
                        (tokens[position].value === "*" ||
                            tokens[position].value === "/")
                    ) {
                        const operator = tokens[position].value;
                        position++;
                        const right = parsePrimary();
                        left = { type: "binary", operator, left, right };
                    }

                    return left;
                }

                function parsePrimary() {
                    const token = tokens[position];

                    if (token.type === "number") {
                        position++;
                        return { type: "number", value: token.value };
                    } else if (token.type === "identifier") {
                        position++;

                        if (
                            position < tokens.length &&
                            tokens[position].type === "operator" &&
                            tokens[position].value === "("
                        ) {
                            position++;
                            const args = [];

                            if (
                                tokens[position].type !== "operator" ||
                                tokens[position].value !== ")"
                            ) {
                                args.push(parseExpression());

                                while (
                                    position < tokens.length &&
                                    tokens[position].type === "operator" &&
                                    tokens[position].value === ","
                                ) {
                                    position++;
                                    args.push(parseExpression());
                                }
                            }

                            if (
                                position < tokens.length &&
                                tokens[position].type === "operator" &&
                                tokens[position].value === ")"
                            ) {
                                position++;
                                return {
                                    type: "function",
                                    name: token.value,
                                    args,
                                };
                            } else {
                                throw new Error("Expected closing parenthesis");
                            }
                        }

                        return { type: "identifier", name: token.value };
                    } else if (
                        token.type === "operator" &&
                        token.value === "("
                    ) {
                        position++;
                        const expr = parseExpression();

                        if (
                            position < tokens.length &&
                            tokens[position].type === "operator" &&
                            tokens[position].value === ")"
                        ) {
                            position++;
                            return expr;
                        } else {
                            throw new Error("Expected closing parenthesis");
                        }
                    } else if (
                        token.type === "operator" &&
                        token.value === "-"
                    ) {
                        position++;
                        const expr = parsePrimary();
                        return { type: "unary", operator: "-", operand: expr };
                    } else if (
                        token.type === "operator" &&
                        token.value === "%"
                    ) {
                        position++;
                        const expr = parsePrimary();
                        return { type: "unary", operator: "%", operand: expr };
                    }

                    throw new Error(
                        `Unexpected token: ${JSON.stringify(token)}`,
                    );
                }

                const ast = parseExpression();

                if (position !== tokens.length) {
                    throw new Error("Unexpected tokens after expression");
                }

                return ast;
            }

            function evaluate(ast, forexData) {
                switch (ast.type) {
                    case "number":
                        return ast.value;

                    case "binary":
                        const left = evaluate(ast.left, forexData);
                        const right = evaluate(ast.right, forexData);

                        switch (ast.operator) {
                            case "+":
                                return left + right;
                            case "-":
                                return left - right;
                            case "*":
                                return left * right;
                            case "/":
                                return left / right;
                            default:
                                throw new Error(
                                    `Unknown binary operator: ${ast.operator}`,
                                );
                        }

                    case "unary":
                        const operand = evaluate(ast.operand, forexData);

                        switch (ast.operator) {
                            case "-":
                                return -operand;
                            case "%":
                                return operand / 100;
                            default:
                                throw new Error(
                                    `Unknown unary operator: ${ast.operator}`,
                                );
                        }

                    case "function":
                        const args = ast.args.map((arg) =>
                            evaluate(arg, forexData),
                        );

                        if (customFunctions[ast.name]) {
                            return customFunctions[ast.name](...args);
                        } else {
                            throw new Error(`Unknown function: ${ast.name}`);
                        }

                    case "identifier":
                        throw new Error(`Unknown identifier: ${ast.name}`);

                    default:
                        throw new Error(`Unknown AST node type: ${ast.type}`);
                }
            }

            function extractVariables(sectionData) {
                const variables = {};
                for (const item of sectionData) {
                    const [varName, formula] = Object.entries(item)[0];
                    variables[varName] = { formula };
                }
                return variables;
            }

            function isSliderFormula(formula) {
                return (
                    formula.trim().startsWith("slider(") &&
                    formula.trim().endsWith(")")
                );
            }

            function extractSliderParams(formula) {
                const paramsStr = formula
                    .trim()
                    .substring(7, formula.length - 1);
                const params = paramsStr.split(",");
                const sliderId = params[0].trim();
                const numericParams = params
                    .slice(1)
                    .map((p) => parseFloat(p.trim()));
                return {
                    id: sliderId,
                    min: numericParams[0],
                    max: numericParams[1],
                    defaultValue: numericParams[2],
                    step: numericParams[3] !== undefined ? numericParams[3] : 1,
                };
            }

            function formatResult(
                result,
                sectionName,
                varName,
                precise = false,
            ) {
                const sectionSettings = Object.assign(
                    {},
                    settings[sectionName] || {},
                    settings[sectionName]
                        ? settings[sectionName][varName] || {}
                        : {},
                );
                const unit = sectionSettings.unit || "";
                const isMoney = sectionSettings.money === true;

                let formattedResult;
                if (precise) {
                    formattedResult = Math.abs(result).toLocaleString(
                        undefined,
                        { maximumFractionDigits: 20 },
                    );
                } else if (isMoney && Math.abs(result) >= 1000000000) {
                    formattedResult =
                        (Math.abs(result) / 1000000000).toFixed(2) + "B";
                } else if (isMoney && Math.abs(result) >= 1000000) {
                    formattedResult =
                        (Math.abs(result) / 1000000).toFixed(2) + "M";
                } else if (isMoney && Math.abs(result) >= 10000) {
                    formattedResult =
                        (Math.abs(result) / 1000).toFixed(2) + "K";
                } else {
                    formattedResult = Math.abs(result).toLocaleString(
                        undefined,
                        { maximumFractionDigits: 2 },
                    );
                }

                if (isMoney) {
                    if (result < 0) {
                        return "- " + unit + formattedResult;
                    } else {
                        return unit + formattedResult;
                    }
                } else {
                    return formattedResult + " " + unit;
                }
            }

            function renderSection(sectionName, sectionData, allData) {
                const variables = extractVariables(sectionData);

                const sectionElement = document.createElement("div");
                sectionElement.className =
                    "bg-white dark:bg-gray-800 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 p-6 border border-gray-200 dark:border-gray-700";
                sectionElement.dataset.section = sectionName;

                const sectionTitle = document.createElement("h2");
                sectionTitle.className =
                    "font-poppins text-2xl font-semibold mb-4 text-indigo-700 dark:text-indigo-400 border-b border-gray-300 dark:border-gray-600 pb-2 tracking-wide";
                sectionTitle.textContent = sectionName;
                sectionElement.appendChild(sectionTitle);

                const variablesList = document.createElement("div");
                variablesList.className = "space-y-3";

                for (const [varName, varData] of Object.entries(variables)) {
                    const varElement = document.createElement("div");
                    varElement.className =
                        "grid grid-cols-3 gap-4 items-center border-t border-gray-200 dark:border-gray-700 pt-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 rounded-lg px-2 transition-colors duration-150";
                    varElement.dataset.variable = varName;

                    const nameElement = document.createElement("div");
                    nameElement.className =
                        "font-semibold text-gray-800 dark:text-gray-200";
                    nameElement.textContent = varName;

                    const formulaElement = document.createElement("div");
                    formulaElement.className =
                        "font-mono text-indigo-600 dark:text-indigo-400 text-sm";

                    if (isSliderFormula(varData.formula)) {
                        const sliderParams = extractSliderParams(
                            varData.formula,
                        );

                        const sliderContainer = document.createElement("div");
                        sliderContainer.className = "flex flex-col space-y-2";

                        const controlsWrapper = document.createElement("div");
                        controlsWrapper.className =
                            "flex items-center space-x-2";

                        const slider = document.createElement("input");
                        slider.type = "range";
                        slider.min = sliderParams.min;
                        slider.max = sliderParams.max;
                        slider.step = sliderParams.step;

                        const currentValue =
                            sliderValues[sliderParams.id] !== undefined
                                ? sliderValues[sliderParams.id]
                                : sliderParams.defaultValue;

                        slider.value = currentValue;
                        slider.className =
                            "w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-600 dark:accent-indigo-500";

                        const numericInput = document.createElement("input");
                        numericInput.type = "number";
                        numericInput.min = sliderParams.min;
                        numericInput.max = sliderParams.max;
                        numericInput.step = sliderParams.step;
                        numericInput.value = currentValue;
                        numericInput.className =
                            "w-32 text-sm p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent transition-all";

                        const valueDisplay = document.createElement("span");
                        valueDisplay.className =
                            "text-sm font-semibold text-gray-700 dark:text-gray-300";
                        valueDisplay.textContent =
                            parseFloat(currentValue).toFixed(2);

                        const updateValue = (value) => {
                            const parsedValue = parseFloat(value);
                            slider.value = parsedValue;
                            numericInput.value = parsedValue;
                            valueDisplay.textContent = parsedValue.toFixed(2);
                            sliderValues[sliderParams.id] = parsedValue;

                            const sections =
                                document.querySelectorAll("[data-section]");
                            sections.forEach((section) => {
                                const sectionName = section.dataset.section;
                                const sectionData = data[sectionName];
                                const newSection = renderSection(
                                    sectionName,
                                    sectionData,
                                    data,
                                );
                                section.replaceWith(newSection);
                            });
                        };

                        slider.addEventListener("change", function () {
                            updateValue(this.value);
                        });

                        numericInput.addEventListener("change", function () {
                            let value = parseFloat(this.value);
                            value = Math.max(
                                sliderParams.min,
                                Math.min(sliderParams.max, value),
                            );
                            updateValue(value);
                        });

                        controlsWrapper.appendChild(slider);
                        controlsWrapper.appendChild(numericInput);

                        sliderContainer.appendChild(controlsWrapper);
                        sliderContainer.appendChild(valueDisplay);

                        formulaElement.textContent = "";
                        formulaElement.appendChild(sliderContainer);
                    } else {
                        const formattedFormula = varData.formula
                            .replace(/([+\-*/=<>!&|^%])/g, " $1 ")
                            .replace(/\(/g, "(")
                            .replace(/\)/g, ")")
                            .replace(/\s+/g, " ")
                            .trim();

                        formulaElement.textContent = "";

                        const tokens = formattedFormula.split(" ");

                        tokens.forEach((token) => {
                            if (token.match(/^[A-Za-z][A-Za-z0-9.]*$/)) {
                                const varSpan = document.createElement("span");
                                varSpan.textContent = token;
                                varSpan.className = "cursor-help relative";

                                const tooltip = document.createElement("div");
                                tooltip.className =
                                    "absolute hidden group-hover:block bg-gray-900 dark:bg-gray-700 text-white text-xs rounded-lg p-2 z-10 -mt-16 -ml-3 shadow-xl border border-gray-700 dark:border-gray-500";
                                tooltip.style.minWidth = "120px";

                                try {
                                    const value = evaluateFormula(
                                        token,
                                        variables,
                                        allData,
                                    );
                                    const targetSection = token.includes(".")
                                        ? token.split(".")[0]
                                        : sectionName;
                                    const targetVar = token.includes(".")
                                        ? token.split(".")[1]
                                        : token;
                                    tooltip.textContent = `${token} = ${formatResult(value, targetSection, targetVar, true)}`;
                                } catch (e) {
                                    tooltip.textContent = `${token} (undefined)`;
                                }

                                const group = document.createElement("span");
                                group.className = "group inline-block";
                                group.appendChild(varSpan);
                                group.appendChild(tooltip);

                                formulaElement.appendChild(group);
                            } else {
                                formulaElement.appendChild(
                                    document.createTextNode(" " + token + " "),
                                );
                            }
                        });

                        varElement.addEventListener("mouseup", function () {
                            const selection = window.getSelection();
                            if (selection.toString().trim()) {
                                try {
                                    const selectedFormula =
                                        selection.toString();
                                    const result = evaluateFormula(
                                        selectedFormula,
                                        variables,
                                        allData,
                                    );

                                    const tooltip =
                                        document.createElement("div");
                                    tooltip.className =
                                        "absolute bg-indigo-600 dark:bg-indigo-500 text-white text-xs rounded-lg p-2 z-10 -ml-3 shadow-xl border border-indigo-500 dark:border-indigo-400";
                                    tooltip.textContent = `= ${typeof result === "number" ? formatResult(result, sectionName, undefined, true) : result}`;

                                    document.body.appendChild(tooltip);

                                    const range = selection.getRangeAt(0);
                                    const rect = range.getBoundingClientRect();
                                    tooltip.style.top = `${rect.bottom + window.scrollY + 10}px`;
                                    tooltip.style.left = `${rect.left + window.scrollX}px`;
                                    tooltip.style.display = "block";

                                    const clearTooltip = () => {
                                        const existingTooltips =
                                            document.querySelectorAll(
                                                "div.absolute.bg-indigo-600, div.absolute.dark\\:bg-indigo-500",
                                            );
                                        existingTooltips.forEach((t) =>
                                            t.remove(),
                                        );
                                    };

                                    document.addEventListener(
                                        "selectionchange",
                                        () => {
                                            if (
                                                window
                                                    .getSelection()
                                                    .toString()
                                                    .trim() === ""
                                            ) {
                                                clearTooltip();
                                            }
                                        },
                                    );

                                    document.addEventListener(
                                        "mousedown",
                                        (e) => {
                                            if (!e.target.closest(".formula")) {
                                                clearTooltip();
                                            }
                                        },
                                        { once: true },
                                    );
                                } catch (e) {
                                    console.error(
                                        "Error evaluating selection:",
                                        e,
                                    );
                                }
                            }
                        });
                    }
                    const resultElement = document.createElement("div");
                    resultElement.className =
                        "font-bold text-right cursor-help relative text-gray-900 dark:text-gray-100";

                    const result = evaluateFormula(
                        varData.formula,
                        variables,
                        allData,
                    );

                    const tooltip = document.createElement("div");
                    tooltip.className =
                        "absolute hidden group-hover:block bg-gray-900 dark:bg-gray-700 text-white text-xs rounded-lg p-2 z-10 -mt-16 right-0 shadow-xl border border-gray-700 dark:border-gray-500";
                    tooltip.style.minWidth = "120px";

                    if (typeof result === "number") {
                        resultElement.textContent = formatResult(
                            result,
                            sectionName,
                            varName,
                        );
                        tooltip.textContent = `${varName} = ${formatResult(result, sectionName, varName, true)}`;
                    } else {
                        resultElement.textContent = result;
                        tooltip.textContent = result;
                    }

                    const resultGroup = document.createElement("span");
                    resultGroup.className = "group inline-block relative";
                    resultGroup.appendChild(resultElement);
                    resultGroup.appendChild(tooltip);

                    varElement.appendChild(nameElement);
                    varElement.appendChild(formulaElement);
                    varElement.appendChild(resultGroup);

                    variablesList.appendChild(varElement);
                }

                sectionElement.appendChild(variablesList);
                return sectionElement;
            }

            async function initDashboard() {
                if (typeof forex !== "undefined") {
                    const forexSection = [];
                    for (const [key, value] of Object.entries(forex)) {
                        forexSection.push({ [key]: value });
                    }
                    data.Forex = forexSection;
                }

                const sectionsContainer =
                    document.getElementById("financialSections");

                for (const [sectionName, sectionData] of Object.entries(data)) {
                    const sectionElement = renderSection(
                        sectionName,
                        sectionData,
                        data,
                    );
                    sectionsContainer.appendChild(sectionElement);
                }
            }

            function initDarkMode() {
                const darkModeToggle =
                    document.getElementById("darkModeToggle");
                const html = document.documentElement;

                const savedTheme = localStorage.getItem("theme");
                if (
                    savedTheme === "dark" ||
                    (!savedTheme &&
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches)
                ) {
                    html.classList.add("dark");
                }

                darkModeToggle.addEventListener("click", () => {
                    html.classList.toggle("dark");

                    if (html.classList.contains("dark")) {
                        localStorage.setItem("theme", "dark");
                    } else {
                        localStorage.setItem("theme", "light");
                    }
                });
            }

            window.addEventListener("DOMContentLoaded", () => {
                initDashboard();
                initDarkMode();
            });
        </script>
    </body>
</html>
